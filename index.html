<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber World — Jawad Ahmad</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            navy: {
              950: '#050e1a',
              900: '#071426',
              800: '#0a192f',
              700: '#112240',
              600: '#1b335c',
            },
            cyanpulse: {
              400: '#22d3ee',
              500: '#00e5ff',
              600: '#0891b2',
            },
          },
        },
      },
    };
  </script>
  <style>
    /* Custom styling for subtle circuit grid backdrop, smooth modals, and high contrast */
    body {
      background-color: #071426;
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }

    .hero-circuit-bg {
      background-color: #071426;
      background-image:
        radial-gradient(circle at 50% 35%, rgba(34, 211, 238, 0.14) 0%, rgba(7, 20, 38, 0.92) 68%),
        linear-gradient(to right, rgba(34, 211, 238, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34, 211, 238, 0.06) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
    }

    .tech-card {
      background: linear-gradient(180deg, rgba(17, 34, 64, 0.94) 0%, rgba(10, 25, 47, 0.98) 100%);
      border: 1px solid rgba(34, 211, 238, 0.22);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .tech-card:hover {
      transform: translateY(-4px);
      border-color: rgba(34, 211, 238, 0.65);
      box-shadow: 0 14px 32px -10px rgba(0, 229, 255, 0.22);
    }

    .cyan-glow-btn {
      background: linear-gradient(135deg, #22d3ee 0%, #00e5ff 100%);
      color: #04101e;
      box-shadow: 0 8px 24px -6px rgba(34, 211, 238, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .cyan-glow-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
      box-shadow: 0 12px 28px -6px rgba(0, 229, 255, 0.6);
    }

    .profile-ring {
      box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.22), 0 0 28px rgba(0, 229, 255, 0.28);
    }

    /* Owner Settings button is hidden from regular visitors by default */
    #openOwnerPanelBtn {
      display: none;
    }

    body.owner-access-visible #openOwnerPanelBtn {
      display: inline-flex;
    }

    /* Custom scrollbar for clean dark aesthetics */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #050e1a;
    }
    ::-webkit-scrollbar-thumb {
      background: #1b335c;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #22d3ee;
    }
  </style>
</head>
<body class="bg-navy-900 text-slate-100 antialiased selection:bg-cyanpulse-400 selection:text-navy-950">

  <!-- Toast / Status Banner (replaces alert/confirm) -->
  <div id="statusToast" role="status" aria-live="polite"
       class="fixed bottom-5 right-5 z-50 hidden max-w-sm rounded-2xl border border-cyanpulse-400/50 bg-navy-700/95 px-4 py-3 text-sm font-medium text-white shadow-2xl backdrop-blur-md">
    <div class="flex items-center gap-3">
      <span class="inline-block h-2.5 w-2.5 shrink-0 rounded-full bg-cyanpulse-400"></span>
      <span id="statusToastMessage">Updated successfully.</span>
    </div>
  </div>

  <!-- Top Navigation Bar -->
  <header class="sticky top-0 z-40 w-full border-b border-cyanpulse-400/15 bg-navy-950/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3.5 sm:px-6">
      <!-- Brand / Visitor Badge -->
      <a id="brandLogoLink" href="#home" class="flex items-center gap-2.5 rounded-xl px-2 py-1 text-base font-bold tracking-tight text-white transition hover:text-cyanpulse-400">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg border border-cyanpulse-400/40 bg-navy-700 text-cyanpulse-400">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="4" width="18" height="14" rx="2" />
            <path d="M8 20h8M12 18v2" />
          </svg>
        </span>
        <span id="brandTitleText">Cyber World</span>
      </a>

      <!-- Navigation Links -->
      <nav aria-label="Primary Navigation" class="flex items-center gap-1 sm:gap-2 text-sm font-medium">
        <a href="#home" class="rounded-xl px-3 py-2 text-slate-200 transition hover:bg-navy-700 hover:text-cyanpulse-400">Home</a>
        <a href="#about" class="rounded-xl px-3 py-2 text-slate-200 transition hover:bg-navy-700 hover:text-cyanpulse-400">About</a>
        <a href="#technology" class="rounded-xl px-3 py-2 text-slate-200 transition hover:bg-navy-700 hover:text-cyanpulse-400">Technology</a>
        <a href="#contact" class="rounded-xl px-3 py-2 text-slate-200 transition hover:bg-navy-700 hover:text-cyanpulse-400">Contact</a>
